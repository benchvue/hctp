<style>
  :root{
    --paper:#f7f4ec; --card:#ffffff; --ink:#2a251d;
    --gold:#a9812f; --gold-dim:#c8ab6e; --muted:#867d6d; --line:#e3dcc9;
    --zoom:1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;font-weight:300;min-height:100vh;
    font-size:calc(14px * var(--zoom))}
  header{text-align:center;padding:clamp(26px,6vw,54px) 16px 10px}
  .eyebrow{font-size:calc(11px * var(--zoom));letter-spacing:.4em;text-indent:.4em;
    color:var(--gold);text-transform:uppercase}
  .logo-chip{display:inline-block;margin-top:16px;background:#fff;border-radius:16px;
    padding:12px 20px;box-shadow:0 0 0 1px rgba(169,129,47,.35),0 14px 34px -14px rgba(90,70,30,.4)}
  .logo-chip img{display:block;width:min(280px,64vw);height:auto}
  h1{font-family:'Cormorant Garamond',serif;font-weight:400;
    font-size:calc(30px * var(--zoom));letter-spacing:.1em;margin-top:14px}
  h1 em{font-style:italic;color:var(--gold)}
  .toolbar{display:flex;gap:8px;justify-content:center;align-items:center;
    flex-wrap:wrap;margin-top:16px}
  .toolbar a,.zbtn{border:1px solid var(--gold);border-radius:999px;background:#fff;
    color:var(--gold);font-size:13px;padding:7px 14px;text-decoration:none;cursor:pointer;
    font-family:inherit;-webkit-tap-highlight-color:transparent}
  .zbtn{font-weight:500;min-width:44px}
  .toolbar a:hover,.zbtn:hover{background:var(--gold);color:#fff}

  .tabs{display:flex;gap:8px;justify-content:flex-start;flex-wrap:nowrap;
    overflow-x:auto;padding:18px 16px 4px;max-width:1000px;margin:0 auto;
    -webkit-overflow-scrolling:touch}
  .tabs button{flex:0 0 auto;border:1px solid var(--gold);border-radius:999px;
    background:#fff;color:var(--gold);font-family:inherit;
    font-size:calc(13.5px * var(--zoom));padding:9px 18px;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .tabs button.on{background:var(--gold);color:#fff;font-weight:500}

  .legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
    padding:10px 16px 0;max-width:1000px;margin:0 auto}
  .legend span{font-size:calc(11px * var(--zoom));padding:4px 10px;border-radius:20px;
    border:1px solid rgba(0,0,0,.08)}

  .wrap{max-width:1000px;margin:14px auto 70px;padding:0 12px}
  .tbl-scroll{overflow-x:auto;border-radius:14px;
    box-shadow:0 10px 30px -16px rgba(90,70,30,.35);background:#fff;
    border:1px solid var(--line)}
  table.sched{border-collapse:collapse;width:100%;min-width:620px}
  .sched th{background:#6f9fce;color:#fff;font-weight:500;text-align:left;
    padding:11px 12px;font-size:calc(13.5px * var(--zoom));letter-spacing:.03em}
  .sched td{padding:11px 12px;font-size:calc(13.5px * var(--zoom));
    border-top:1px solid rgba(0,0,0,.06);line-height:1.5;vertical-align:top}
  .sched td.lab{font-weight:400;white-space:nowrap}
  .sched td.tim{white-space:nowrap;color:#333}
  .updated{font-size:calc(11px * var(--zoom));color:var(--muted);text-align:center;margin-top:12px}
  footer{text-align:center;color:var(--muted);font-size:11.5px;
    letter-spacing:.14em;padding:0 16px 40px}
</style>

/* ══════════ 상태 ══════════ */
let schedule = DEFAULT_SCHEDULE;
let curDay = (() => { const d = new Date().getDay(); return (d>=1 && d<=5) ? d-1 : 0; })();
let zoom = 1;

/* ══════════ Drive에서 최신 시간표 읽기 (실패하면 기본값) ══════════ */
async function loadFromDrive(){
  if (!CONFIG.apiKey || CONFIG.apiKey.indexOf("PASTE_") === 0) return;
  try{
    const q1 = encodeURIComponent("'"+CONFIG.rootFolder+"' in parents and name='"+CONFIG.dbFolder+"' and trashed=false");
    const d1 = await fetch("https://www.googleapis.com/drive/v3/files?q="+q1+"&fields=files(id)&key="+CONFIG.apiKey).then(r=>r.json());
    const dbId = d1.files && d1.files[0] && d1.files[0].id;
    if (!dbId) return;
    const q2 = encodeURIComponent("'"+dbId+"' in parents and name='"+CONFIG.scheduleFile+"' and trashed=false");
    const d2 = await fetch("https://www.googleapis.com/drive/v3/files?q="+q2+"&fields=files(id,modifiedTime)&key="+CONFIG.apiKey).then(r=>r.json());
    const f = d2.files && d2.files[0];
    if (!f) return;
    const data = await fetch("https://www.googleapis.com/drive/v3/files/"+f.id+"?alt=media&key="+CONFIG.apiKey).then(r=>r.json());
    if (data && Array.isArray(data.days) && data.days.length){
      schedule = data;
      const t = new Date(f.modifiedTime);
      document.getElementById("updatedNote").textContent =
        "Last updated: " + t.toLocaleDateString() + " " + t.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    }
  }catch(e){ /* fallback to DEFAULT_SCHEDULE */ }
}

/* ══════════ 렌더 ══════════ */
const esc = t => String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function render(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  schedule.days.forEach((d,i) => {
    const b = document.createElement("button");
    b.textContent = d.title.split(",")[0];
    b.className = i===curDay ? "on" : "";
    b.addEventListener("click", () => { curDay=i; render(); });
    tabs.appendChild(b);
  });

  const leg = document.getElementById("legend");
  leg.innerHTML = Object.keys(CLASS_BG).map(k =>
    "<span style='background:"+CLASS_BG[k]+"'>"+CLASS_LABEL[k]+"</span>").join("");

  const day = schedule.days[curDay];
  const tbl = document.getElementById("schedTable");
  let h = "<tr><th style='min-width:110px'>"+esc(day.title)+"</th>"
        + "<th style='min-width:120px'>Time</th>"
        + "<th>Team : "+esc(day.teamA)+"</th>"
        + "<th>Team : "+esc(day.teamB)+"</th></tr>";
  day.rows.forEach(r => {
    const rowBg = KIND_BG[r.kind] || KIND_BG.plain;
    h += "<tr>";
    h += "<td class='lab' style='background:"+rowBg+"'>"+esc(r.label)+"</td>";
    h += "<td class='tim' style='background:"+rowBg+"'>"+esc(r.time)+"</td>";
    if (r.span){
      h += "<td colspan='2' style='background:"+rowBg+"'>"+esc(r.text)+"</td>";
    } else {
      const ca = CLASS_BG[classOf(r.a)] || "#f4f6fa";
      const cb = CLASS_BG[classOf(r.b)] || "#f4f6fa";
      h += "<td style='background:"+ca+"'>"+esc(r.a)+"</td>";
      h += "<td style='background:"+cb+"'>"+esc(r.b)+"</td>";
    }
    h += "</tr>";
  });
  tbl.innerHTML = h;
}

/* ══════════ 글자 확대/축소 (노안 지원) — 핀치 줌도 그대로 가능 ══════════ */
function setZoom(z){
  zoom = Math.min(1.8, Math.max(0.8, z));
  document.documentElement.style.setProperty("--zoom", zoom);
}
document.getElementById("zIn").addEventListener("click", () => setZoom(zoom + 0.15));
document.getElementById("zOut").addEventListener("click", () => setZoom(zoom - 0.15));

render();
loadFromDrive().then(render);
